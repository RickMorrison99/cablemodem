apiVersion: v1
kind: Pod
metadata:
  name: cablemodem-e2e
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: cablemodem:local
      ports:
        - containerPort: 8765
      volumeMounts:
        - name: workspace
          mountPath: /src
      command: ["/bin/sh", "-c"]
      args: ["python -m app.main"]
    - name: playwright
      image: python:3.11-slim
      env:
        - name: BASE_URL
          value: "http://app:8765"
      volumeMounts:
        - name: workspace
          mountPath: /src
      command: ["/bin/sh", "-c"]
      args:
        - pip install --no-cache-dir -r /src/requirements-playwright.txt && \
          python -m playwright install --with-deps && \
          pytest /src/tests/e2e -q
  volumes:
    - name: workspace
      hostPath:
        path: /home/rick/src/cablemodem
        type: Directory
